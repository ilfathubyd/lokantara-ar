<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Lokantara AR</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        font-family: Arial, sans-serif;
      }

      .loading-content {
        text-align: center;
        color: white;
      }

      .spinner {
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .loading-text {
        font-size: 18px;
        margin-bottom: 15px;
        font-weight: bold;
      }

      .progress-bar {
        width: 200px;
        height: 8px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 4px;
        overflow: hidden;
        margin: 20px auto 0;
      }

      .progress-fill {
        height: 100%;
        background: white;
        width: 0%;
        transition: width 0.3s ease;
      }

      .progress-text {
        font-size: 14px;
        margin-top: 10px;
        opacity: 0.9;
      }
    </style>
  </head>

  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loading-content">
        <div class="spinner"></div>
        <div class="loading-text">Mempersiapkan AR...</div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-text"><span id="progress-text">0</span>%</div>
      </div>
    </div>

    <!-- AR Scene -->
    <a-scene
      id="ar-scene"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
      style="display: none;"
    >
      <a-assets>
        <a-asset-item id="model1" src="model/01_baju_adat_dayak.glb"></a-asset-item>
        <a-asset-item id="model2" src="model/01_mandau.glb"></a-asset-item>
        <a-asset-item id="model3" src="model/01_tameng_dayak_shield.glb"></a-asset-item>
      </a-assets>

      <a-marker type="barcode" value="6">
        <a-entity
          gltf-model="#model1"
          scale="1 1 1"
          position="0 0 0"
        ></a-entity>

        <a-entity
          gltf-model="#model2"
          scale="3 3 3"
          position="1 0 0"
        ></a-entity>

        <a-entity
          gltf-model="#model3"
          scale="0.2 0.2 0.2"
          position="-1 0 0"
        ></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Preload models dan tampilkan progress
      function preloadModels() 
      {
        const models = [
          'model/01_baju_adat_dayak.glb',
          'model/01_mandau.glb',
          'model/01_tameng_dayak_shield.glb'
        ];

        let loadedCount = 0;
        const totalModels = models.length;

        function updateProgress() 
        {
          loadedCount++;
          const progress = Math.round((loadedCount / totalModels) * 100);
          document.getElementById('progress-fill').style.width = progress + '%';
          document.getElementById('progress-text').textContent = progress;

          if (loadedCount === totalModels) {
            showARScene();
          }
        }

        // Load setiap model
        models.forEach((modelPath) => 
        {
          const loader = new THREE.GLTFLoader();
          loader.load(modelPath, updateProgress, undefined, (error) => 
          {
            console.error('Error loading model:', modelPath, error);
            updateProgress(); // Tetap lanjut walaupun ada error
          });
        });
      }

      function showARScene() 
      {
        // Sembunyikan loading screen
        document.getElementById('loading-screen').style.display = 'none';
        
        // Tampilkan AR scene
        document.getElementById('ar-scene').style.display = 'block';
      }

      // Mulai preload saat halaman selesai dimuat
      window.addEventListener('load', () => preloadModels());
    </script>
  </body>
</html>
