<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR.js First Test</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-marker type="pattern" url="marker/marker.patt">
        <a-entity
          gltf-model="model/01_baju_adat_dayak.glb"
          scale="1 1 1"
          position="0 0 0"
        >
        </a-entity>

        <a-entity
          gltf-model="model/01_mandau.glb"
          scale="0.5 0.5 0.5"
          position="0 10 0"
        >
        </a-entity>

        <a-entity
          gltf-model="model/01_tameng_dayak_shield.glb"
          scale="0.5 0.5 0.5"
          position="0 20 0"
        >
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
