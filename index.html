<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Lokantara AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
  <script src="https://rawgit.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      color: white;
      font-family: Arial, sans-serif;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255,255,255,.3);
      border-top: 4px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<div id="loading-screen">
  <div>
    <div class="spinner"></div>
    <div>Mempersiapkan AR...</div>
  </div>
</div>

<a-scene
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false;"
  vr-mode-ui="enabled: false"
  style="display:none;"
  id="ar-scene"
>

  <!-- ================= ASSETS ================= -->
  <a-assets>
    <!-- DAYAK -->
    <a-asset-item id="dayak_baju" src="model/01_baju_adat_dayak.glb"></a-asset-item>
    <a-asset-item id="dayak_mandau" src="model/01_mandau.glb"></a-asset-item>
    <a-asset-item id="dayak_tameng" src="model/01_tameng_dayak_shield.glb"></a-asset-item>

    <!-- BUGIS -->
    <a-asset-item id="bugis_badik" src="model/02_badik.glb"></a-asset-item>
    <a-asset-item id="bugis_rumah" src="model/02_rumah_adat_bugis.glb"></a-asset-item>

    <!-- YOGYAKARTA -->
    <a-asset-item id="jogja_benteng" src="model/03_benteng_vandeburg_3d.glb"></a-asset-item>
    <a-asset-item id="jogja_gunungan" src="model/03_gunungan_wayang.glb"></a-asset-item>
    <a-asset-item id="jogja_jogja" src="model/03_jogja_3d.glb"></a-asset-item>
    <a-asset-item id="jogja_tugu" src="model/03_tugu_jogja.glb"></a-asset-item>
  </a-assets>

  <!-- ================= MARKER 0 : DAYAK ================= -->
  <a-marker type="barcode" value="0" smooth="true">

    <a-entity gltf-model="#dayak_baju"
      position="0 0 0"
      scale="0.4 0.4 0.4">
    </a-entity>

    <a-entity gltf-model="#dayak_mandau"
      position="0.6 0 0"
      scale="0.25 0.25 0.25"
      rotation="0 90 0">
    </a-entity>

    <a-entity gltf-model="#dayak_tameng"
      position="-0.6 0 0"
      scale="0.3 0.3 0.3">
    </a-entity>

  </a-marker>

  <!-- ================= MARKER 1 : BUGIS ================= -->
  <a-marker type="barcode" value="1" smooth="true">

    <a-entity gltf-model="#bugis_rumah"
      position="0 0 0"
      scale="0.2 0.2 0.2">
    </a-entity>

    <a-entity gltf-model="#bugis_badik"
      position="0.7 0 0"
      scale="0.15 0.15 0.15"
      rotation="0 90 0">
    </a-entity>

  </a-marker>

  <!-- ================= MARKER 2 : YOGYAKARTA ================= -->
  <a-marker type="barcode" value="2" smooth="true">

    <a-entity gltf-model="#jogja_tugu"
      position="0 0 0"
      scale="0.35 0.35 0.35">
    </a-entity>

    <a-entity gltf-model="#jogja_benteng"
      position="1 0 0"
      scale="0.15 0.15 0.15">
    </a-entity>

    <a-entity gltf-model="#jogja_gunungan"
      position="-1 0 0"
      scale="0.25 0.25 0.25">
    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  window.addEventListener("load", () => {
    document.getElementById("loading-screen").style.display = "none";
    document.getElementById("ar-scene").style.display = "block";
  });
</script>

</body>
</html>
