<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Lokantara AR</title>

    <!-- A-Frame & AR.js -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/loaders/GLTFLoader.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      /* ===== LOADING ===== */
      #loading-screen {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        z-index: 9999;
        flex-direction: column;
      }

      /* ===== INFO CARD ===== */
      .info-card {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 360px;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 14px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        z-index: 10000;
        animation: slideUp 0.3s ease;
      }

      .info-card.hidden {
        display: none;
      }

      .info-header {
        display: flex;
        justify-content: space-between;
        padding: 14px 16px;
        font-weight: bold;
        border-bottom: 1px solid #eee;
      }

      .info-header button {
        background: none;
        border: none;
        font-size: 18px;
        cursor: pointer;
      }

      .info-body {
        padding: 14px 16px;
        font-size: 14px;
        line-height: 1.6;
        color: #333;
      }

      @keyframes slideUp {
        from {
          transform: translate(-50%, 20px);
          opacity: 0;
        }
        to {
          transform: translate(-50%, 0);
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <!-- ===== INFO CARD ===== -->
    <div id="info-card" class="info-card hidden">
      <div class="info-header">
        <span id="info-title"></span>
        <button id="close-card">✕</button>
      </div>
      <div class="info-body" id="info-content"></div>
    </div>

    <!-- ===== LOADING ===== -->
    <div id="loading-screen">Mempersiapkan AR…</div>

    <!-- ===== AR SCENE ===== -->
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      vr-mode-ui="enabled: false"
      style="display:none"
      id="ar-scene"
    >
      <a-assets>
        <a-asset-item id="dayak" src="model/Set_Dayak.glb"></a-asset-item>
        <a-asset-item id="bugis" src="model/Set_Bugis.glb"></a-asset-item>
        <a-asset-item id="jogja" src="model/Set_Jogja.glb"></a-asset-item>
      </a-assets>

      <!-- ===== MARKER DAYAK ===== -->
      <a-marker type="barcode" value="0">
        <a-entity
          gltf-model="#dayak"
          scale="0.4 0.4 0.4"
          class="clickable"
          data-title="Budaya Dayak"
          data-info="Budaya Dayak melambangkan keberanian, kearifan lokal, serta nilai spiritual yang kuat melalui mandau, tameng, dan pakaian adat."
        ></a-entity>

        <!-- ICON INFO -->
        <a-entity
          class="clickable"
          data-title="Budaya Dayak"
          data-info="Budaya Dayak melambangkan keberanian dan identitas masyarakat Kalimantan."
          geometry="primitive: circle; radius: 0.06"
          material="color: #2979FF; opacity: 0.95"
          position="0 0.65 0"
          animation="property: scale; from:1 1 1; to:1.25 1.25 1.25; dir:alternate; loop:true; dur:900"
        ></a-entity>

        <a-text
          value="i"
          color="white"
          align="center"
          position="0 0.65 0.01"
          scale="0.6 0.6 0.6"
        ></a-text>
      </a-marker>

      <!-- ===== MARKER BUGIS ===== -->
      <a-marker type="barcode" value="1">
        <a-entity
          gltf-model="#bugis"
          scale="0.25 0.25 0.25"
          rotation="0 -90 0"
          class="clickable"
          data-title="Budaya Bugis"
          data-info="Budaya Bugis dikenal dengan nilai siri’, keberanian, dan rumah adat yang mencerminkan struktur sosial masyarakat."
        ></a-entity>
      </a-marker>

      <!-- ===== MARKER JOGJA ===== -->
      <a-marker type="barcode" value="2">
        <a-entity
          gltf-model="#jogja"
          scale="0.5 0.5 0.5"
          class="clickable"
          data-title="Budaya Yogyakarta"
          data-info="Budaya Yogyakarta identik dengan nilai kesopanan, filosofi hidup Jawa, dan arsitektur keraton."
        ></a-entity>
      </a-marker>

      <!-- CAMERA + CLICK SUPPORT -->
      <a-entity
        camera
        cursor="rayOrigin: mouse"
        raycaster="objects: .clickable"
      ></a-entity>
    </a-scene>

    <!-- ===== SCRIPT ===== -->
    <script>
      const card = document.getElementById("info-card");
      const titleEl = document.getElementById("info-title");
      const contentEl = document.getElementById("info-content");
      const closeBtn = document.getElementById("close-card");

      function showCard(title, content) {
        titleEl.textContent = title;
        contentEl.textContent = content;
        card.classList.remove("hidden");
      }

      closeBtn.onclick = () => card.classList.add("hidden");

      AFRAME.registerComponent("click-handler", {
        init() {
          this.el.addEventListener("click", e => {
            e.stopPropagation();
            const t = this.el.getAttribute("data-title");
            const c = this.el.getAttribute("data-info");
            if (t && c) showCard(t, c);
          });
        }
      });

      document.querySelectorAll(".clickable").forEach(el => {
        el.setAttribute("click-handler", "");
      });

      // AUTO CLOSE SAAT MARKER HILANG
      document.querySelectorAll("a-marker").forEach(marker => {
        marker.addEventListener("markerLost", () => {
          card.classList.add("hidden");
        });
      });

      // SHOW SCENE
      window.onload = () => {
        document.getElementById("loading-screen").style.display = "none";
        document.getElementById("ar-scene").style.display = "block";
      };
    </script>
  </body>
</html>
