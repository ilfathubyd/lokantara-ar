<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Lokantara AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
  <script src="https://rawgit.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-family: Arial, sans-serif;
    }

    .loading-content {
      text-align: center;
      color: white;
    }

    .spinner {
      border: 4px solid rgba(255,255,255,.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .progress-bar {
      width: 220px;
      height: 8px;
      background: rgba(255,255,255,.3);
      border-radius: 4px;
      overflow: hidden;
      margin: 15px auto 0;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: white;
      transition: width .3s ease;
    }

    .progress-text {
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<!-- ================= LOADING SCREEN ================= -->
<div id="loading-screen">
  <div class="loading-content">
    <div class="spinner"></div>
    <div><b>Mempersiapkan AR...</b></div>

    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="progress-text">
      <span id="progress-text">0</span>%
    </div>
  </div>
</div>

<!-- ================= AR SCENE ================= -->
<a-scene
  id="ar-scene"
  embedded
  style="display:none;"
  arjs="sourceType: webcam; debugUIEnabled: false;"
  vr-mode-ui="enabled:false"
>

  <!-- ================= ASSETS ================= -->
  <a-assets id="asset-manager">

    <!-- DAYAK -->
    <a-asset-item src="model/01_baju_adat_dayak.glb"></a-asset-item>
    <a-asset-item src="model/01_mandau.glb"></a-asset-item>
    <a-asset-item src="model/01_tameng_dayak_shield.glb"></a-asset-item>

    <!-- BUGIS -->
    <a-asset-item src="model/02_badik.glb"></a-asset-item>
    <a-asset-item src="model/02_rumah_adat_bugis.glb"></a-asset-item>

    <!-- YOGYAKARTA -->
    <a-asset-item src="model/03_benteng_vandeburg_3d.glb"></a-asset-item>
    <a-asset-item src="model/03_gunungan_wayang.glb"></a-asset-item>
    <a-asset-item src="model/03_jogja_3d.glb"></a-asset-item>
    <a-asset-item src="model/03_tugu_jogja.glb"></a-asset-item>

  </a-assets>

  <!-- ================= MARKER 0 : DAYAK ================= -->
  <a-marker type="barcode" value="0" smooth="true">
    <a-entity gltf-model="model/01_baju_adat_dayak.glb" scale="0.4 0.4 0.4"></a-entity>
    <a-entity gltf-model="model/01_mandau.glb" position="0.6 0 0" scale="0.25 0.25 0.25"></a-entity>
    <a-entity gltf-model="model/01_tameng_dayak_shield.glb" position="-0.6 0 0" scale="0.3 0.3 0.3"></a-entity>
  </a-marker>

  <!-- ================= MARKER 1 : BUGIS ================= -->
  <a-marker type="barcode" value="1" smooth="true">
    <a-entity gltf-model="model/02_rumah_adat_bugis.glb" scale="0.2 0.2 0.2"></a-entity>
    <a-entity gltf-model="model/02_badik.glb" position="0.7 0 0" scale="0.15 0.15 0.15"></a-entity>
  </a-marker>

  <!-- ================= MARKER 2 : YOGYAKARTA ================= -->
  <a-marker type="barcode" value="2" smooth="true">
    <a-entity gltf-model="model/03_tugu_jogja.glb" scale="0.35 0.35 0.35"></a-entity>
    <a-entity gltf-model="model/03_benteng_vandeburg_3d.glb" position="1 0 0" scale="0.15 0.15 0.15"></a-entity>
    <a-entity gltf-model="model/03_gunungan_wayang.glb" position="-1 0 0" scale="0.25 0.25 0.25"></a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  const assets = document.querySelectorAll('a-assets a-asset-item');
  const totalAssets = assets.length;
  let loadedAssets = 0;

  assets.forEach(asset => {
    asset.addEventListener('loadeddata', () => {
      loadedAssets++;
      const progress = Math.round((loadedAssets / totalAssets) * 100);

      document.getElementById('progress-fill').style.width = progress + '%';
      document.getElementById('progress-text').innerText = progress;

      if (loadedAssets === totalAssets) {
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('ar-scene').style.display = 'block';
      }
    });
  });
</script>

</body>
</html>
